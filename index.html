<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLINTH — Architecture & Spatial Design, Lisbon</title>
  <meta name="description" content="An independent architecture and spatial design studio founded in Lisbon, 2018. We build with intention.">

  <!-- Preconnect for font performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!--
    Cormorant Garamond: display headings
    DM Sans: body, UI, metadata
  -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/masthead.css">
  <link rel="stylesheet" href="css/hero.css">
</head>
<body>

  <!-- ════════════════════════════════════════════
       MASTHEAD — editorial, not a corporate navbar
  ════════════════════════════════════════════ -->
  <header class="masthead" id="masthead" role="banner">
    <div class="masthead__inner">

      <!-- Left: wordmark + discipline label -->
      <div class="masthead__brand">
        <a href="/" class="masthead__wordmark" aria-label="PLINTH — return to homepage">
          PLINTH
        </a>
        <span class="masthead__descriptor" aria-hidden="true">
          Architecture &amp; Spatial Design
        </span>
      </div>

      <!-- Right: navigation -->
      <nav class="masthead__nav" aria-label="Primary navigation">
        <ul class="masthead__nav-list" role="list">
          <li><a href="#work"    class="masthead__nav-link">Work</a></li>
          <li><a href="#studio"  class="masthead__nav-link">Studio</a></li>
          <li><a href="#contact" class="masthead__nav-link">Contact</a></li>
        </ul>

        <!-- Mobile menu toggle (visible <768px) -->
        <button
          class="masthead__menu-btn"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="mobile-menu"
          type="button"
        >
          <span class="masthead__menu-icon" aria-hidden="true"></span>
        </button>
      </nav>

    </div>

    <!-- Mobile menu drawer -->
    <div class="masthead__mobile-menu" id="mobile-menu" hidden>
      <ul role="list">
        <li><a href="#work"    class="mobile-link">Work</a></li>
        <li><a href="#studio"  class="mobile-link">Studio</a></li>
        <li><a href="#contact" class="mobile-link">Contact</a></li>
      </ul>
      <p class="mobile-meta">Lisbon &amp; Porto — Est. 2018</p>
    </div>
  </header>


  <!-- ════════════════════════════════════════════
       MAIN CONTENT
  ════════════════════════════════════════════ -->
  <main id="main-content">

    <!-- ── HERO ─────────────────────────────────
         Featured project: Casa Mouraria, Lisbon
    ─────────────────────────────────────────── -->
    <section class="hero" aria-label="Featured project: Casa Mouraria">

      <!-- Full-bleed photograph -->
      <div class="hero__media">
        <img
          src="casa-mouraria-hero.jpg"
          alt="Interior of Casa Mouraria — afternoon light falling across white plaster walls and raw concrete floor, Lisbon 2025"
          class="hero__photo"
          fetchpriority="high"
          loading="eager"
          decoding="async"
        >
        <!-- Subtle scrim: ensures headline legibility without killing the image -->
        <div class="hero__scrim" aria-hidden="true"></div>
      </div>

      <!-- Headline and metadata — positioned over the image -->
      <div class="hero__content">
        <div class="hero__text-block">
          <h1 class="hero__headline">Buildings<br><em>that belong.</em></h1>
          <div class="hero__meta" aria-label="Project details">
            <span class="hero__meta-rule" aria-hidden="true"></span>
            <dl class="hero__meta-list">
              <div class="hero__meta-item">
                <dt class="hero__meta-label">Project</dt>
                <dd class="hero__meta-value">Casa Mouraria</dd>
              </div>
              <div class="hero__meta-item">
                <dt class="hero__meta-label">Location</dt>
                <dd class="hero__meta-value">Lisbon, Portugal</dd>
              </div>
              <div class="hero__meta-item">
                <dt class="hero__meta-label">Year</dt>
                <dd class="hero__meta-value">2025</dd>
              </div>
            </dl>
          </div>
        </div>
      </div>

      <!-- Scroll indicator -->
      <div class="hero__scroll-cue" aria-hidden="true">
        <div class="hero__scroll-line"></div>
        <span class="hero__scroll-label">Scroll</span>
      </div>

    </section>


    <!-- ── PLACEHOLDER: upcoming sections ───────
         (Gallery, Studio, Contact — built next)
    ─────────────────────────────────────────── -->
    <section class="section-pending" id="work" aria-label="Work — coming soon">
      <div class="section-pending__inner">
        <p class="section-pending__label">Work</p>
      </div>
    </section>

    <section class="section-pending" id="studio" aria-label="Studio — coming soon">
      <div class="section-pending__inner">
        <p class="section-pending__label">Studio</p>
      </div>
    </section>

    <section class="section-pending" id="contact" aria-label="Contact — coming soon">
      <div class="section-pending__inner">
        <p class="section-pending__label">Contact</p>
      </div>
    </section>

  </main>


  <script src="js/masthead.js"></script>
</body>
</html>
